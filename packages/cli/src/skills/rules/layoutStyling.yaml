# Judgment rules for flow and positioning styling — keys are the style properties that
# govern flow. (`layout` alone names the AST in specs; this file is layout *styling*.)
#
# useWhen: ordered, first match wins. when: property interdependencies — setting the
# key's value opens (makes meaningful) or requires the listed properties.
# guidelines: items keyed by obligation, RFC 2119 — must / must-not (absolute),
# should / should-not (strong, disregard only with a considered reason), may (permitted).
# Beside an obligation: instead, example, reads, note, adr.
components:
  guidelines:
    - should: "reach for the library's own layout component before authoring a tree of styled containers"
      must-not: "build a column of rows out of bare `container` elements when the library publishes components for exactly that — the output is styled divs a consumer could not have assembled from the library"
      reads: config/conventions/<platform>.primitives.yaml (which component a container promotes to), specs/foundations/layout/guidelines.yaml (which layout components this system offers and how they nest)
      note: "which layout components exist, what they are called, and the order they nest in are the library's own facts, declared in its foundations layout guidelines; this rule only says to go and look. A library with neither layout components nor a promotion map authors containers, and the rule is inert rather than implied"
      adr: [74, 75]
    - should: "keep an atomic component's own internals primitive — the promotion map governs composed content (compositions, instanceExamples, slot content), not what a small component is built from"
      adr: 74

layoutMode:
  useWhen:
    HORIZONTAL|VERTICAL: children flow along one axis — itemSpacing, padding and the alignments do the work
    GRID: children fill cells of equal tracks on one templated axis, in source order
    NONE: freeform — every child positioned explicitly
  when:
    HORIZONTAL|VERTICAL:
      opens: [itemSpacing, padding, mainAxisAlignment, crossAxisAlignment, wrap]
    GRID:
      opens: [gridColumns, gridRows, itemSpacing, padding]
      requires: exactly one of gridColumns and gridRows non-null — that is the templated axis
      adr: 122
  guidelines:
    - must: "template exactly one axis on a `GRID` — set `gridColumns` or `gridRows`, never both"
      must-not: "reach for `GRID` to express a fixed two-dimensional arrangement; it templates one axis and fills cells in source order, so the other axis is a consequence of the child count"
      adr: 122
    - should: "write an integer track count where the design fixes the number of tracks, and the adaptive form where the count should follow the container's width"
      example: "`{minSize: <n>}` for the adaptive form"
      adr: 122

width:
  guidelines:
    - should: "give a composition or other page-scale root a concrete width — `FILL` at a rendered root has no parent to fill and collapses"
      note: "the number is the system's page width, not a default — read it from the system's own compositions or ask; nothing here supplies one"
    - must-not: "write `width` beside `layoutSizingHorizontal: FILL` and expect them to negotiate — writing `width` forces the node's horizontal sizing to FIXED on render, whatever the spec declares beside it"
      note: "on a *component root* the FILL intent survives as a Dev Mode annotation, because a Figma root cannot hold FILL; anywhere else the width simply wins"
layoutSizingHorizontal|layoutSizingVertical:
  guidelines:
    - may: "declare `FILL` on a *component* root to state how it sizes in a consumer's layout — the standalone rendered node has no parent and collapses to content width, which is expected rather than a defect"
      example: "`layoutSizingHorizontal: FILL` on a text root, for \"fill its container\""
      note: "capture reads this off a Dev Mode annotation (`sizingHorizontal:fill` / `sizingVertical:fill` on the root, same grammar as `role:`) because a Figma root cannot hold FILL itself; an authored spec just states the value"
position:
  useWhen:
    AUTO: the child participates in the container's flow (default)
    ABSOLUTE: the child pins over or outside the flow (notch, badge dot, overlay)
  when:
    ABSOLUTE:
      opens: [top, start, end, bottom, centerHorizontalOffset, centerVerticalOffset, width, height]
      note: offsets anchor edges — "locked to the upper right" = top + end; px number or "%" string
      adr: 41
    AUTO:
      opens: [layoutSizingHorizontal, layoutSizingVertical]
  guidelines:
    - should: "pin an `ABSOLUTE` child with offsets; hanging past the edge takes a negative offset and parent `clipsContent: false`"
      example: "`bottom: -6`"
      adr: 41
    - must: "swap offset edges in a placement variant — null the old edge, set the new one"
      example: "`bottom: null` + `top: -6`"
      must-not: "stack both edges of an axis"
    - may: "pin a full-bleed layer to all four sides — a state background or scrim stretches with its parent, and is the sanctioned departure from the one-edge-per-axis rule (ruled by the system owner)"
      example: "`top: 0, end: 0, bottom: 0, start: 0`"
