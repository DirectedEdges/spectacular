# Judgment rules for variants.yaml — the default baseline and the layered deltas.
defaultBaseline:
  guidelines:
    - should: "describe every element the anatomy declares in `default.elements` — an element declared but left out of `default` is legal and validates clean, and is still poor practice: the baseline is where a reader learns what the element is, and a variant that is the element's first mention reads as a delta from nothing"
layering:
  guidelines:
    - must: "author each variant as only its diff from `default` — the resolved state is every matching variant layered onto the default in order"
      should: "omit a variant whose diff is empty"
      adr: 34
    - never: "write two style keys that compete for the same outcome within one variant or within `default` — state one. Across variants it is fine: matching variants layer, and the resolution is the renderer's own styles mechanics, not something to restate here"
content:
  guidelines:
    - must: "spell a glyph name — in `content`, a bound prop's `default`, and its `examples` — in the workspace's formatted key spelling (`info`, `caretRight`), never the raw icon cache name (`Info`, `Caret Right`); the renderer matches content against cache names run through `format.keys`, and a raw spelling matches nothing"
conditionals:
  guidelines:
    - must: "write a visibility conditional as `isNull` on the content prop with `then: false` — `visible: {if: {condition: {operation: isNull, args: {value: {$binding: '#/props/<prop>'}}}, then: false, else: true}}`. The operation asks whether the prop *is* null and `then` is the visibility when it is, so the element shows exactly when the prop carries something"
      never: "name any other operation in a visibility condition — `isNull` is the only null test the analyzer recognizes, and a condition naming anything else yields no rule at all: the element then renders unconditionally, with nothing failing and nothing warning"
      note: "the generic `{if: {condition, then, else}}` shape in `references/styles.md` describes the schema's conditional, not the vocabulary that has an effect here. The closed operation set is a consequence of prop consolidation — see the consolidating-props guide on the docs site — and a slot or content prop whose boolean visibility toggle was merged into its nullability is the normal case for this form"
      adr: 80
configuration:
  guidelines:
    - warn: "an absent prop key inherits; a `null` value overrides with unset — different statements, not interchangeable"
      adr: 80
variantBudget:
  guidelines:
    - must: "multiply the enum lengths of every Figma variant axis before authoring `variants.yaml`, and state the product — a Figma component set is the cross product of its axes, not the count of `variants[]` entries (`mode` 3 × `gridColumns` 3 × `itemSpacing` 10 × `padding` 11 = 990 frames from 23 deltas)"
      note: "the product is arithmetic on `api.yaml` alone, available before the first variant is written and before any Figma access"
    - must: "stop and get the human's approval when the product exceeds 100 — name the number, name the risk (render time, and a component set large enough to make their Figma file unusable), and offer the alternative of fewer enum values or fewer variant axes in the spec"
      never: "reach `specs render` to discover the count — render exits successfully and reports a node id either way, and the file it leaves behind can be unusable (990 frames took 56.5s and locked a human's Figma; the same spec at 140 took 3.0s)"
    - should: "move the axis carrying the least visual information to a code-only prop when the product cannot come down otherwise — `rules/props.yaml · codeOnly` already names a cross-product too large for a component set as its clear case"
