# Judgment rules for slot declaration, binding, and fills — across api, variants, and examples.
#
# useWhen: ordered, evaluate top to bottom, first match wins.
# guidelines: items keyed by obligation, RFC 2119 — must / must-not (absolute),
# should / should-not (strong, disregard only with a considered reason), may (permitted).
# Beside an obligation: instead, example, reads, note, adr.
fills:
  useWhen:
    plain-child-nesting: the target slot is the component's designated defaultSlot — nest the filling instance as an ordinary child
    slotContentRef: any other slot — bind explicitly with $slotContent; only this form names which slot
  guidelines:
    - should: "nest a `defaultSlot` fill as a plain child — nothing points between levels"
      adr: 99
    - must: "author a named fill as a self-contained anatomy+elements+layout triplet in `slotContentExamples`, referenced by `$slotContent`"
      adr: [46, 47, 49]
constraints:
  guidelines:
    - should: "constrain a slot with `minChildren`/`maxChildren` (non-negative integers) and list permitted component type names in `anyOf`"
      must-not: "use the retired `minItems`/`maxItems`"
      adr: [28, 56]
requestLanguage:
  guidelines:
    - must: "read a request's composability language as a slot before modelling it as toggleable anatomy — \"composable\", \"consumers supply\", \"X visible by default and Y hidden\" describe a slot and its default fill, never boolean visibility props"
      example: "a hidden-by-default glyph is `visible: false` on the glyph in the default `slotContentExamples` fill, not a `showGlyph` prop"
      adr: 99
defaultFill:
  guidelines:
    - must: "author the slot's default state into its default fill (`children.examples[0]`'s triplet) — presence, hiddenness, and content of the out-of-the-box children all live there"
      adr: 99
authoringOrder:
  guidelines:
    - should: "author `examples.yaml` next when `variants.yaml` fails validation on a slot-bearing component, rather than reworking the binding"
      note: "expect that failure once: the `children.examples[0]` `$slotContent` pointer cannot resolve until `examples.yaml` exists"
contentStyles:
  guidelines:
    - must: "declare `contentStyles` on the slot element itself, keyed by primitive kind — one fill may hold both a text run and a glyph, and each kind takes a disjoint property set"
      example: "`$text`, `$glyph` — the same reserved markers the slot prop's `anyOf` carries"
      reads: styles.schema.json ContentStyles, Element.contentStyles
      adr: 102
    - must: "keep the fill primitive where the slot's `contentStyles` carries formatting that matters — a component fill is formatted by the component it instantiates, so a consumer applies the component's styles and discards `contentStyles` entirely"
      note: "this is the one condition under which the promotion map's `must` yields: `anatomy.yaml · primitiveOrInstance` routes the decision here, and the formatting the slot declares is what decides it"
      adr: [102, 74]
    - must-not: "inline a governed key on the fill itself — a key the sheet states against the fill's `data-content` marker outranks every variant rule and the consumer's cascade when it is also written inline"
      instead: "state it once in `contentStyles` and let the emitted stylesheet carry it per variant"
      adr: 102
layout:
  guidelines:
    - must: "size a slot-bearing element `layoutSizingVertical: HUG` — a slot's height belongs to whatever fills it, and `FIXED` renders the component wrong"
      must-not: "leave a slot-bearing element's vertical sizing to chance — state `HUG` even when it looks like the obvious default"
      note: "`layoutSizingVertical` on a collapsed primitive wrapper is the slot box's own child-layout value; the collapse split keeps it there and leaves the remaining keys on the root, so one authored element legitimately carries both this and the root's dimension — not a contradiction to reconcile"
      adr: [58, 83]
    - may: "give a slot element its own auto-layout — `layoutMode` and `itemSpacing` on the slot govern the gap between its fills, and emit as flex + gap (ruled by the system owner)"
pointers:
  guidelines:
    - must: "point every `$slotContent` at `#/components/<spec folder key>/slotContentExamples/<name>` (optionally `/subcomponents/<sub>/` in the middle) — the `components` segment names the whole spec-key space, compositions' own fills included"
      must-not: "author `#/compositions/...` pointers — schema-documented, but nothing resolves them today"
