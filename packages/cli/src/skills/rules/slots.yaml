# Judgment rules for slot declaration, binding, and fills — across api, variants, and examples.
fills:
  useWhen:
    plain-child-nesting: the target slot is the component's designated defaultSlot — nest the filling instance as an ordinary child
    slotContentRef: any other slot — bind explicitly with $slotContent; only this form names which slot
  guidelines:
    - should: "nest a `defaultSlot` fill as a plain child — nothing points between levels"
      adr: 99
    - must: "author a named fill as a self-contained anatomy+elements+layout triplet in `slotContentExamples`, referenced by `$slotContent`"
      adr: [46, 47, 49]
constraints:
  guidelines:
    - should: "constrain a slot with `minChildren`/`maxChildren` (non-negative integers) and list permitted component type names in `anyOf`"
      never: "use the retired `minItems`/`maxItems`"
      adr: [28, 56]
requestLanguage:
  guidelines:
    - must: "read a request's composability language as a slot before modelling it as toggleable anatomy — \"composable\", \"consumers supply\", \"X visible by default and Y hidden\" describe a slot and its default fill, never boolean visibility props (a hidden-by-default glyph is `visible: false` on the glyph in the default `slotContentExamples` fill, not a `showGlyph` prop)"
      adr: 99
defaultFill:
  guidelines:
    - must: "author the slot's default state into its default fill (`children.examples[0]`'s triplet) — presence, hiddenness, and content of the out-of-the-box children all live there"
      adr: 99
authoringOrder:
  guidelines:
    - warn: "expect `variants.yaml` to fail validation once on a slot-bearing component — its `children.examples[0]` `$slotContent` pointer cannot resolve until `examples.yaml` exists; author examples next rather than reworking the binding"
layout:
  guidelines:
    - must: "size a slot-bearing element `layoutSizingVertical: HUG` — a slot's height belongs to whatever fills it, and `FIXED` renders the component wrong"
      never: "leave a slot-bearing element's vertical sizing to chance — state `HUG` even when it looks like the obvious default"
      note: "`layoutSizingVertical` on a collapsed primitive wrapper is the slot box's own child-layout value; the collapse split keeps it there and leaves the remaining keys on the root, so one authored element legitimately carries both this and the root's dimension — not a contradiction to reconcile"
      adr: [58, 83]
    - could: "a slot element may own its auto-layout — `layoutMode` and `itemSpacing` on the slot govern the gap between its fills, and emit as flex + gap (ruled by the system owner)"
pointers:
  guidelines:
    - must: "point every `$slotContent` at `#/components/<spec folder key>/slotContentExamples/<name>` (optionally `/subcomponents/<sub>/` in the middle) — the `components` segment names the whole spec-key space, compositions' own fills included"
      never: "author `#/compositions/...` pointers — schema-documented, but nothing resolves them today"
