# Judgment rules for api.yaml props.* — consistency with the catalogue is graded.
naming:
  guidelines:
    - should: "reuse an existing prop name and value set when the concept matches (`analysis/props.yaml`)"
      never: "coin a synonym for a prop the system already has (`text` where the catalogue says `label`)"
    - should: "follow the enum value casing and vocabulary the catalogue itself uses (`analysis/props.yaml`) — never import another system's casing or size scale"
nullable:
  guidelines:
    - should: "omit `nullable` on open-valued props — absence already means nullable for string, number, slot, and image props"
      must: "write `nullable: true` explicitly on an enum prop that accepts null — absence there means not nullable"
      adr: 65
enum:
  guidelines:
    - must: "write `nullable: false` on a number prop carrying an `enum`, keep the enum in authored variant-axis order with the default first, and never sort it"
      adr: 72
    - should: "keep the whole prop a string enum when any one option is non-numeric"
      adr: 72
glyphProps:
  guidelines:
    - must: "spell a glyph-bound prop's `default` and every entry in its `examples` in the workspace's formatted key spelling (`info`, `caretRight`) — a glyph name is a reference into the icon key space, exactly as `instanceOf` is into the component key space, and the renderer matches it against `formatKey(<cache name>, format.keys)`; the raw cache spelling (`Info`, `Caret Right`) matches nothing and the glyph silently drops"
      note: "deliberately opposite to enum option values, which are vocabulary and keep the library's own spelling verbatim (`Primary inverse`) — references are formatted, vocabulary is verbatim; when unsure which a value is, ask whether something resolves it (reference) or displays it (vocabulary)"
default:
  guidelines:
    - should: "put demo content in `examples` and reserve `default` for a genuine contractual fallback (a Figma-authored `Label` value is an example, not a default)"
      adr: [14, 88]
variantProps:
  guidelines:
    - must: "declare a boolean prop whose value drives variant deltas — it appears in any `variants[].configuration` — with `$extensions: {com.figma: {type: VARIANT}}`; the renderer otherwise models it as a Figma BOOLEAN property, which can only toggle visibility, and the styling deltas never land on the canvas"
      note: "enum props — string and number alike — become variant axes on their own, no marker; the marker is specifically the styling-driving boolean's"
codeOnly:
  guidelines:
    - must: "declare a prop that exists only in code — never as a Figma variant axis — with `$extensions: {com.figma: {type: TEXT, source: {kind: codeOnlyProp, layer: <name>}, name: <name>}}`; the renderer's code-only handling reads exactly this declaration, and an undeclared string prop's disposition in the component set is guesswork (an accessibility label is the canonical case)"
    - never: "coin the `name`/`layer` value yourself — it is the library's own Figma vocabulary, and teams differ (`a11yLabel`, `Accessible label`, …); take it from the designer's language or the workspace's Figma naming convention applied to the prop key, and surface the choice under Decisions to confirm"
    - must: "read `layer` as this prop's own sub-layer — one per code-only prop (`layer: headingLevel` for a `headingLevel` prop) — never the name of a shared container holding all code-only props"
invalidPropCombinations:
  guidelines:
    - must: "declare illegal prop combinations as `invalidPropCombinations` in api.yaml — api vocabulary (prop names and values), never in variants"
      adr: 92
