# Judgment rules for api.yaml anatomy.* — keys mirror the schema node they govern.
#
# useWhen: ordered, evaluate top to bottom, first match wins.
# guidelines: items keyed by obligation, RFC 2119 — must / must-not (absolute),
# should / should-not (strong, disregard only with a considered reason), may (permitted).
# Beside an obligation: instead, example, reads, note, adr.
type:
  useWhen:
    instance: a component already expresses it
    text: a text run
    glyph: a named icon
    slot: a region consumers fill
    container: carries any block styling or layout role
    vector: literal vector artwork, none of the above
    rectangle|ellipse|line|polygon|star: literal vector geometry only
  guidelines:
    - must: "model a styled block as a `container`"
      example: "`notch: container; 12x12; rotation 45; position ABSOLUTE; bottom -6; parent clipsContent: false`"
      must-not: "use a shape primitive for anything carrying style — background, radius, padding, offsets"
primitiveOrInstance:
  # Four separate judgments, not one rule with exceptions. The first question is whose
  # anatomy you are writing: a component's own internals are never the promotion map's
  # business. Only inside composed content does the map decide anything, and even there
  # two conditions keep a primitive primitive.
  useWhen:
    own-internals: "you are writing the component's own anatomy — its label, its box, its icon slot. The promotion map does not reach here at all"
    composed-promoted: "composed content (a composition, an `instanceExamples` entry, a `slotContentExamples` fill) where the map covers the primitive AND the target has a spec folder — author the instance"
    composed-pending-target: "composed content where the map names a target that has no spec folder yet — author the primitive and report the gap"
    composed-content-styles: "composed content inside a slot whose `contentStyles` must format the fill — author the primitive, because an instance would discard that formatting (`slots.yaml · contentStyles`)"
  guidelines:
    - should: "keep a component's own internals primitive — `text`, `glyph` and `container` elements the component itself owns"
      note: "the promotion map governs composed content, never what a small component is built from; a component-owned primitive is the correct authoring, not a missed promotion"
      example: "a badge's label is `text`, not `acmeText`"
      adr: 74
    - must: "author a primitive the library's promotion map covers as that component instance, configured by its mapped props, in compositions, instanceExamples, and slot content"
      must-not: "author a styled primitive in composed content where a promoted component exists"
      example: "a `text` card title where a heading component is mapped"
      reads: config/conventions/<platform>.primitives.yaml
      note: "no promotion map in the workspace → primitives govern composed content too; this rule is inert, not implied"
      adr: [74, 75]
    - should: "author the primitive and report the gap when the map names a target that has no spec folder yet — a growing catalogue declares its roster before authoring it, and the promotion binds only once the target's spec exists"
      note: "the gap is the map's, not yours: the entry is correct and its target is pending. Name it in the report so the roster catches up"
    - may: "keep a primitive in a slot fill the slot's own `contentStyles` formats"
      reads: rules/slots.yaml · contentStyles
      note: "a component fill discards `contentStyles`, so promoting would defeat the formatting the slot declares — the slots rule carries the mechanism"
extensions:
  guidelines:
    - must: "give a collapsed primitive its Figma layer identity — when the primitive IS the component root (a glyph or text with no wrapper), author `$extensions: {com.figma: {name: <layer name>}}` on that anatomy element; without it the renderer names and binds the layer from the raw spec key"
      adr: 58
    - must-not: "hand-author `$extensions.com.figma.promotedPrimitive` — it is a capture record the generator writes so the renderer can restore the original layer"
      instead: "declare `instanceOf` and the element's props; it renders as that instance with no record at all, and copying the block from a generated spec adds Figma-namespace weight it cannot justify"
      adr: [74, 76, 90]
instanceOf:
  guidelines:
    - must: "reference a subcomponent as `{$ref: \"#/subcomponents/<key>\"}` — the pointer is internal, always within the same document"
      adr: [30, 94]
    - must: "spell `instanceOf` as the target's generated component key — grep existing `instanceOf` values or the target's own anatomy references; the folder name is the lowercased form, never the authority"
      example: "`radioGroupItem`, whose folder is `radiogroupitem`"
    - should: "decompose a fixed-anatomy wrapper into its parts when the content needs more repetition than the wrapper's anatomy holds"
      example: "a three-link trail from `breadcrumbLink` ×2 + `breadcrumbSeparator` ×2 + `breadcrumbCurrent`, not one `breadcrumb` whose api is `props: {}`"
role:
  guidelines:
    - must: "give an element at most one `role` — the control or part it *is*; what it *does* goes in `actions`"
      adr: [67, 87]
    - should: "name part roles bare and scoped by position"
      example: "`placeholder`, not `inputPlaceholder`"
      adr: 104
elements:
  guidelines:
    - must-not: "author a plain container wrapping a single text or glyph — the primitive is the element, and generation collapses such wrappers"
      adr: 58
    - must-not: "author a container whose only child is a slot — the slot is the content area"
      instead: "let the root *be* the collapsed primitive — `root: {type: slot}` for a slot-only component, exactly as a text- or glyph-only component's root is the text or glyph element"
      note: "a root stays a `container` the moment any sibling element exists beside the slot"
      adr: 83
    - must-not: "copy a generated spec's container-root-with-slot shape into authored work — capture can leave a wrapper that collapsing did not remove, so a generated exemplar is evidence of what capture produced, not of the sanctioned authored shape; this rule governs"
    - must-not: "bind the root element's `visible` to a prop — whether the component exists at all is the consumer's decision, taken at the call site"
      note: "a tooltip does not decide whether it is on screen; the thing that opens it does, as `{open && <Tooltip/>}`. The root *is* the instance, so hiding it is hiding the instance — which belongs to whatever placed it. `visible` on a child element is the normal case and stays"
